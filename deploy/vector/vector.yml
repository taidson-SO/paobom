api:
  enabled: false

sources:
  docker:
    type: docker_logs
    exclude_containers:
      - paobom-hosted-staging-vector-1

transforms:
  normalize:
    type: remap
    inputs:
      - docker
    source: |
      .environment = "staging"
      .service = to_string(.label."com.docker.compose.service") ?? to_string(.container_name) ?? "unknown"

sinks:
  loki:
    type: loki
    inputs:
      - normalize
    endpoint: http://loki:3100
    encoding:
      codec: json
    labels:
      environment: staging
      service: "{{ service }}"
