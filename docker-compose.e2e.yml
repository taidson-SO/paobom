services:
  postgres-e2e:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: paobom_e2e
      POSTGRES_USER: paobom_e2e
      POSTGRES_PASSWORD: paobom_e2e
    ports:
      - "${E2E_POSTGRES_PORT:-55434}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paobom_e2e -d paobom_e2e"]
      interval: 2s
      timeout: 3s
      retries: 15
